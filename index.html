<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VolleyTeam — Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060A18">
    <meta name="description" content="L'app del giocatore: le tue statistiche, il calendario, gli allenamenti e i tuoi progressi sempre in tasca.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VT Player">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    :root{
        --ink:#060A18;--surface:#0E1525;--surface-2:#141D31;--surface-3:#1B2740;
        --line:#22304E;--line-soft:#1A2238;
        --brand:#22C55E;--brand-deep:#15803D;--brand-glow:rgba(34,197,94,.3);
        --flame:#F0463C;--gold:#F5B301;--silver:#C7D2E0;
        --text:#F3F7FC;--muted:#8395B4;--muted-2:#5C6C8C;--radius:18px;
        --shadow:0 18px 40px -18px rgba(0,0,0,.7);
        --ok:#22C55E;--warn:#F5B301;--bad:#F0463C;--navh:74px;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Urbanist',system-ui,sans-serif;}
    html,body{height:100%;}
    body{background:var(--ink);color:var(--text);min-height:100vh;
        background-image:radial-gradient(900px 500px at 90% -10%,rgba(34,197,94,.08),transparent 60%),
                         radial-gradient(700px 420px at -10% 100%,rgba(240,70,60,.06),transparent 55%);
        padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));}
    h1,h2,h3,h4,.display{font-family:'Outfit',sans-serif;}
    .num{font-variant-numeric:tabular-nums;font-family:'Outfit',sans-serif;}
    ::-webkit-scrollbar{width:0;height:0;}

    /* APP BAR */
    .appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
        padding:calc(.8rem + env(safe-area-inset-top)) 1rem .8rem;background:rgba(6,10,24,.82);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}
    .appbar img{width:34px;height:34px;border-radius:10px;}
    .appbar .t{font-weight:800;font-family:'Outfit';letter-spacing:.5px;font-size:1rem;}
    .appbar .t span{color:var(--brand);}
    .appbar .team{font-size:.7rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:1.5px;}
    .appbar .spacer{flex:1;}
    .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
        color:var(--muted);cursor:pointer;font-size:1rem;transition:.15s;}
    .icon-btn:hover{color:#fff;border-color:var(--brand);}

    .wrap{max-width:560px;margin:0 auto;padding:1rem 1rem 1.5rem;}
    .tab{display:none;animation:rise .4s cubic-bezier(.2,.7,.2,1);}
    .tab.active{display:block;}
    @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

    .demo-banner{background:var(--surface-2);border:1px dashed var(--warn);color:var(--warn);
        border-radius:12px;padding:9px 12px;font-size:.78rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}

    .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem;box-shadow:var(--shadow);}
    .card h3{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:9px;}
    .card h3 i{color:var(--brand);}
    .sec-title{font-size:.7rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:4px;}
    .sec-h{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-bottom:1rem;}

    /* HERO PROFILO */
    .phero{position:relative;overflow:hidden;border-radius:22px;padding:1.4rem;margin-bottom:1rem;
        background:linear-gradient(150deg,#0D1A2E,#0A1020 65%);border:1px solid var(--line);text-align:center;}
    .phero .court{position:absolute;inset:0;opacity:.1;}
    .jersey-big{width:104px;height:104px;border-radius:28px;margin:0 auto .8rem;display:flex;align-items:center;justify-content:center;
        font-family:'Outfit';font-weight:900;font-size:3.2rem;background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#04140A;
        box-shadow:0 14px 30px -10px var(--brand-glow),inset 0 0 0 3px rgba(255,255,255,.15);position:relative;}
    .jersey-big.cap{background:linear-gradient(145deg,var(--gold),#b9860a);}
    .jersey-big .lead{position:absolute;top:-6px;right:-6px;font-size:1.4rem;}
    .phero h2{font-size:1.5rem;font-weight:800;position:relative;}
    .phero .role{color:var(--muted);font-size:.92rem;margin-top:2px;position:relative;}
    .phero .chips{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative;}
    .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:.78rem;font-weight:700;}
    .chip .v{color:var(--brand);} .chip.up .v{color:var(--ok);} .chip.down .v{color:var(--bad);}

    .next-card{display:flex;align-items:center;gap:14px;}
    .cd-circle{width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:var(--surface-2);border:2px solid var(--brand);flex-shrink:0;}
    .cd-circle b{font-size:1.4rem;font-family:'Outfit';font-weight:800;line-height:1;}
    .cd-circle span{font-size:.58rem;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;}
    .next-info b{font-weight:700;font-size:1.05rem;}
    .next-info span{display:block;color:var(--muted);font-size:.84rem;margin-top:2px;}
    .goal-box{background:linear-gradient(135deg,rgba(34,197,94,.1),transparent);border:1px solid rgba(34,197,94,.25);
        border-radius:14px;padding:1rem;display:flex;gap:12px;align-items:flex-start;}
    .goal-box i{color:var(--brand);font-size:1.2rem;margin-top:2px;}
    .goal-box .l{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--brand);font-weight:700;}
    .goal-box p{font-weight:600;margin-top:2px;}

    /* STATS */
    .chart-box svg{width:100%;height:auto;display:block;}
    .chart-grid line{stroke:var(--line-soft);}
    .chart-axis{fill:var(--muted-2);font-size:10px;}
    .spark-line{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
    .spark-dot{fill:var(--ink);stroke:var(--brand);stroke-width:2.5;}
    .empty-chart{padding:1.6rem;text-align:center;color:var(--muted-2);font-style:italic;font-size:.85rem;}
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat-cell{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:.9rem;}
    .stat-cell .l{font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
    .stat-cell .v{font-size:1.6rem;font-weight:800;font-family:'Outfit';margin-top:3px;}
    .stat-cell .v small{font-size:.8rem;color:var(--muted);}
    .mtable{width:100%;border-collapse:collapse;font-size:.84rem;}
    .mtable th{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;}
    .mtable td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line-soft);}
    .mtable td.l{text-align:left;font-weight:600;}

    /* CALENDAR LIST */
    .ev{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
    .ev:last-child{border:none;}
    .ev .dt{width:48px;text-align:center;flex-shrink:0;}
    .ev .dt b{display:block;font-family:'Outfit';font-weight:800;font-size:1.2rem;line-height:1;}
    .ev .dt span{font-size:.64rem;text-transform:uppercase;color:var(--muted-2);}
    .ev .info{flex:1;}.ev .info b{font-weight:600;}
    .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:700;}
    .pill.match{background:var(--brand);color:#04140A;} .pill.train{background:var(--surface-3);color:var(--silver);}
    .pill.win{background:rgba(34,197,94,.16);color:#74e89f;} .pill.loss{background:rgba(240,70,60,.14);color:#ff9189;}
    .pill.next{background:rgba(245,179,1,.16);color:var(--gold);}

    /* TRAINING / EXERCISES */
    .session{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:1rem;margin-bottom:12px;}
    .session .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;}
    .session .sh b{font-weight:700;} .session .sh span{font-size:.78rem;color:var(--muted);}
    .ex-item{padding:.7rem 0;border-top:1px solid var(--line-soft);}
    .ex-item:first-of-type{border-top:none;}
    .ex-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
    .ex-item .name{font-weight:600;}
    .coach-grade{background:var(--surface-3);border-radius:8px;padding:3px 9px;font-family:'Outfit';font-weight:800;font-size:.85rem;}
    .coach-note{font-size:.8rem;color:var(--muted);margin-top:4px;font-style:italic;}
    .coach-note i{color:var(--brand);font-style:normal;}
    .self-rate{display:flex;gap:6px;margin-top:8px;}
    .self-rate button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:var(--surface-3);
        color:var(--muted);font-weight:700;font-size:.78rem;cursor:pointer;transition:.15s;font-family:'Urbanist';}
    .self-rate button.on.good{background:var(--ok);color:#04140A;border-color:var(--ok);}
    .self-rate button.on.mid{background:var(--warn);color:#1a1300;border-color:var(--warn);}
    .self-rate button.on.bad{background:var(--bad);color:#fff;border-color:var(--bad);}

    /* PROGRESS / BADGES */
    .bar-track{height:10px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-top:6px;}
    .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand-deep),var(--brand));transition:width .7s cubic-bezier(.2,.7,.2,1);}
    .badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .badge{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:1rem;text-align:center;position:relative;transition:.2s;}
    .badge.earned{border-color:rgba(34,197,94,.4);box-shadow:0 0 18px -6px var(--brand-glow);}
    .badge.locked{opacity:.45;filter:grayscale(.6);}
    .badge .ic{font-size:1.8rem;margin-bottom:6px;}
    .badge.earned .ic{color:var(--brand);} .badge.locked .ic{color:var(--muted-2);}
    .badge b{display:block;font-size:.86rem;}.badge span{font-size:.7rem;color:var(--muted);}

    /* BOTTOM NAV */
    .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
        background:rgba(10,16,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);
        padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
    .bottomnav button{flex:1;background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:3px;
        font-size:.62rem;font-weight:700;cursor:pointer;padding:6px 2px;border-radius:12px;transition:.15s;font-family:'Urbanist';}
    .bottomnav button i{font-size:1.15rem;}
    .bottomnav button.active{color:var(--brand);}
    .bottomnav button.active i{transform:translateY(-2px);}

    /* MODAL / TOAST */
    .overlay{position:fixed;inset:0;background:rgba(4,8,18,.8);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem;}
    .overlay.show{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.8,.2,1);}
    @keyframes pop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:none;}}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.2rem;border-bottom:1px solid var(--line-soft);}
    .modal-head h3{font-size:1.1rem;font-weight:800;display:flex;gap:9px;align-items:center;}
    .modal-close{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;}
    .modal-body{padding:1.2rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:'Urbanist';font-weight:700;font-size:.9rem;padding:12px 16px;border-radius:11px;transition:.15s;}
    .btn:active{transform:translateY(1px);}
    .btn-accent{background:var(--brand);color:#04140A;} .btn-accent:hover{background:#2fe06f;}
    .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
    textarea,.fileinput{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:.85rem;}
    #toast-stack{position:fixed;top:calc(1rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;width:90%;max-width:420px;}
    .toast{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--brand);padding:11px 14px;border-radius:11px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);animation:sl .3s;}
    .toast.danger{border-left-color:var(--bad);} .toast.danger i{color:var(--bad);}
    .toast.success i{color:var(--brand);}
    @keyframes sl{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
    .empty-state{text-align:center;padding:2rem 1rem;color:var(--muted);}
    .empty-state i{font-size:2.2rem;color:var(--surface-3);display:block;margin-bottom:.6rem;}
    .link-btn{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline;font-size:.85rem;}
    </style>
</head>
<body>
<div id="toast-stack"></div>
<header class="appbar">
    <img src="icons/logo-badge.png" alt="">
    <div>
        <div class="t">VOLLEY<span>TEAM</span></div>
        <div class="team" id="bar-team">Player</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="editMyProfile()" title="Modifica il mio profilo"><i class="fa-solid fa-user-pen"></i></button>
    <button class="icon-btn" onclick="openImport()" title="Importa profilo"><i class="fa-solid fa-arrow-right-to-bracket"></i></button>
</header>

<div class="wrap">
    <section id="profilo" class="tab active"></section>
    <section id="statistiche" class="tab"></section>
    <section id="calendario" class="tab"></section>
    <section id="allenamenti" class="tab"></section>
    <section id="progressi" class="tab"></section>
</div>

<nav class="bottomnav">
    <button data-tab="profilo" class="active" onclick="go('profilo')"><i class="fa-solid fa-user"></i> Profilo</button>
    <button data-tab="statistiche" onclick="go('statistiche')"><i class="fa-solid fa-chart-line"></i> Stats</button>
    <button data-tab="calendario" onclick="go('calendario')"><i class="fa-solid fa-calendar-days"></i> Calendario</button>
    <button data-tab="allenamenti" onclick="go('allenamenti')"><i class="fa-solid fa-dumbbell"></i> Allenamenti</button>
    <button data-tab="progressi" onclick="go('progressi')"><i class="fa-solid fa-trophy"></i> Progressi</button>
</nav>

<div class="overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>

<script src="app.js"></script>
</body>
</html>
