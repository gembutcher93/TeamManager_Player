<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AIRIM</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060A18">
    <meta name="description" content="Gestionale completo per l'allenatore di pallavolo: roster, calendario, scout statistico, rotazioni, presenze e lavagnetta tattica.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AIRIM">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    :root{
        --ink:#060A18; --surface:#0E1525; --surface-2:#141D31; --surface-3:#1B2740;
        --line:#22304E; --line-soft:#1A2238;
        --brand:#22C55E; --brand-deep:#15803D; --brand-glow:rgba(34,197,94,.30);
        --flame:#F0463C; --flame-soft:rgba(240,70,60,.14);
        --gold:#F5B301; --silver:#C7D2E0;
        --text:#F3F7FC; --muted:#8395B4; --muted-2:#5C6C8C;
        --sidebar-w:264px; --radius:16px;
        --shadow:0 18px 40px -18px rgba(0,0,0,.7);
        --ok:#22C55E; --warn:#F5B301; --bad:#F0463C;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Urbanist',system-ui,sans-serif;}
    html,body{height:100%;}
    body{background:var(--ink);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;
        background-image:radial-gradient(1200px 600px at 80% -10%, rgba(34,197,94,.07), transparent 60%),
                         radial-gradient(900px 500px at -10% 110%, rgba(240,70,60,.05), transparent 55%);}
    h1,h2,h3,h4,.display{font-family:'Outfit',sans-serif;}
    .num{font-variant-numeric:tabular-nums;font-family:'Outfit',sans-serif;}
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;}
    ::-webkit-scrollbar-track{background:transparent;}
    a{color:inherit;}

    /* ===== SIDEBAR ===== */
    aside{width:var(--sidebar-w);background:linear-gradient(180deg,#070B16,#0A1020);
        border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
        padding:1.4rem 1rem;position:fixed;inset:0 auto 0 0;z-index:60;
        padding-top:calc(1.4rem + env(safe-area-inset-top));}
    .brand-top{display:flex;flex-direction:column;align-items:center;gap:.7rem;margin-bottom:1.3rem;}
    .brand-logo{width:72px;height:72px;border-radius:18px;
        box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 0 1px rgba(34,197,94,.28);}
    .brand-name{font-weight:800;font-size:1.18rem;letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.1;}
    .brand-name span{color:var(--brand);}
    .brand-sub{font-size:.66rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted-2);}
    .team-edit{display:flex;align-items:center;gap:6px;margin-top:2px;}
    .team-edit button{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:.8rem;transition:.2s;}
    .team-edit button:hover{color:var(--brand);}
    #team-input{display:none;width:140px;background:var(--ink);border:1px solid var(--brand);color:#fff;
        text-align:center;font-weight:700;border-radius:8px;padding:5px;text-transform:uppercase;font-size:.85rem;}

    .nav{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:.4rem;overflow-y:auto;}
    .nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;
        color:var(--muted);font-size:.95rem;font-weight:600;padding:11px 13px;border-radius:11px;
        cursor:pointer;transition:.18s;text-align:left;font-family:'Urbanist';position:relative;}
    .nav button i{width:20px;text-align:center;font-size:1rem;}
    .nav button:hover{background:var(--surface-2);color:var(--text);}
    .nav button.active{background:linear-gradient(90deg,rgba(34,197,94,.16),rgba(34,197,94,.04));
        color:#fff;box-shadow:inset 2px 0 0 var(--brand);}
    .nav button.active i{color:var(--brand);}
    .nav .badge-dot{margin-left:auto;background:var(--flame);color:#fff;font-size:.62rem;font-weight:800;
        padding:1px 7px;border-radius:20px;}
    .side-foot{margin-top:auto;padding-top:1rem;border-top:1px solid var(--line-soft);}
    .side-foot p{font-size:.78rem;color:var(--muted-2);}
    .side-foot .active-team{color:var(--text);font-weight:700;font-size:.95rem;}

    /* ===== LAYOUT ===== */
    main{flex:1;margin-left:var(--sidebar-w);padding:1.8rem 2rem 4rem;max-width:1240px;width:100%;}
    .section{display:none;animation:rise .45s cubic-bezier(.2,.7,.2,1);}
    .section.active{display:block;}
    @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap;}
    .eyebrow{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--brand);font-weight:700;}
    .page-head h2{font-size:1.9rem;font-weight:800;letter-spacing:-.5px;margin-top:3px;}
    .page-head p.sub{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:540px;}

    .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
        padding:1.3rem;margin-bottom:1.2rem;box-shadow:var(--shadow);}
    .card h3{font-size:1.05rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:9px;}
    .card h3 i{color:var(--brand);}
    .card .hint{font-size:.8rem;color:var(--muted-2);margin-top:.6rem;}

    /* ===== FORMS / BUTTONS ===== */
    .form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
    .fg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
    .fg label{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
    .fg input,.fg select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
        padding:11px 12px;border-radius:10px;font-size:.92rem;font-weight:500;transition:.18s;}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow);}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
        font-family:'Urbanist';font-weight:700;font-size:.9rem;padding:11px 16px;border-radius:10px;transition:.18s;white-space:nowrap;}
    .btn:active{transform:translateY(1px);}
    .btn-accent{background:var(--brand);color:#04140A;box-shadow:0 8px 20px -8px var(--brand-glow);}
    .btn-accent:hover{background:#2fe06f;}
    .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
    .btn-ghost:hover{border-color:var(--brand);color:#fff;}
    .btn-danger{background:var(--flame);color:#fff;}
    .btn-danger:hover{filter:brightness(1.08);}
    .btn-sm{padding:7px 11px;font-size:.82rem;border-radius:9px;}
    .btn-icon{padding:8px 10px;}

    /* ===== iOS-STYLE TOGGLE SWITCH ===== */
    .ios-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px;}
    .ios-switch input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
    .ios-switch-track{position:relative;flex:0 0 auto;width:51px;height:31px;border-radius:999px;background:#8E8E93;transition:background .25s ease;}
    .ios-switch-thumb{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.4,0,.2,1);}
    .ios-switch input:checked ~ .ios-switch-track{background:#34C759;}
    .ios-switch input:checked ~ .ios-switch-track .ios-switch-thumb{transform:translateX(20px);}
    .ios-switch input:focus-visible ~ .ios-switch-track{outline:2px solid var(--brand);outline-offset:2px;}
    .ios-switch-label{font-size:.9rem;font-weight:500;color:var(--text);}

    /* ===== TABLES ===== */
    .table-wrap{overflow-x:auto;border-radius:12px;}
    table{width:100%;border-collapse:collapse;font-size:.9rem;}
    thead th{text-align:center;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
        font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
    tbody td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
    tbody tr{transition:background .15s;}
    tbody tr:hover{background:var(--surface-2);}
    tbody tr.clickable{cursor:pointer;}
    .empty-row td{color:var(--muted-2);padding:1.6rem;font-style:italic;}

    /* ===== PILLS / BADGES ===== */
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:30px;font-size:.74rem;
        font-weight:700;background:var(--surface-3);color:var(--silver);}
    .pill.role{background:rgba(34,197,94,.12);color:#74e89f;}
    .pill.match{background:var(--brand);color:#04140A;}
    .pill.train{background:var(--surface-3);color:var(--silver);}
    .pill.win{background:rgba(34,197,94,.16);color:#74e89f;}
    .pill.loss{background:var(--flame-soft);color:#ff9189;}
    .jersey{width:38px;height:38px;border-radius:11px;background:var(--surface-3);color:#fff;display:flex;
        align-items:center;justify-content:center;font-weight:800;font-family:'Outfit';cursor:pointer;
        margin:0 auto;border:1.5px solid transparent;transition:.18s;}
    .jersey:hover{border-color:var(--brand);}
    .jersey.captain{border-color:var(--gold);box-shadow:0 0 12px -2px rgba(245,179,1,.5);}
    .jersey.vice{border-color:var(--silver);}
    .lead-tag{font-size:.7rem;font-weight:800;margin-left:6px;}
    .lead-tag.c{color:var(--gold);} .lead-tag.v{color:var(--silver);}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
    .voto{font-weight:800;font-family:'Outfit';}
    .form-arrow{font-size:.8rem;margin-left:5px;}

    /* ===== DASHBOARD ===== */
    .hero{position:relative;overflow:hidden;border-radius:20px;padding:1.6rem;margin-bottom:1.2rem;
        background:linear-gradient(135deg,#0C162A,#0A1020 60%);border:1px solid var(--line);}
    .hero .court{position:absolute;inset:0;opacity:.13;pointer-events:none;}
    .hero-inner{position:relative;display:flex;justify-content:space-between;gap:1.4rem;flex-wrap:wrap;}
    .hero-label{font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand);font-weight:700;}
    .hero h2{font-size:1.8rem;font-weight:800;margin:6px 0;letter-spacing:-.5px;}
    .hero .meta{color:var(--muted);font-size:.95rem;}
    .countdown{display:flex;gap:10px;margin-top:14px;}
    .cd-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:62px;}
    .cd-box b{display:block;font-size:1.5rem;font-family:'Outfit';font-weight:800;line-height:1;}
    .cd-box span{font-size:.64rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:1.2rem;}
    .kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:1.05rem 1.1rem;
        position:relative;overflow:hidden;transition:.2s;}
    .kpi:hover{transform:translateY(-3px);border-color:var(--line);}
    .kpi .ic{position:absolute;right:-6px;top:-8px;font-size:3.2rem;opacity:.06;}
    .kpi .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
    .kpi .val{font-size:2rem;font-weight:800;font-family:'Outfit';margin-top:4px;line-height:1;}
    .kpi .val small{font-size:.9rem;color:var(--muted);font-weight:600;}
    .kpi .delta{font-size:.78rem;margin-top:6px;font-weight:700;}
    .delta.up{color:var(--ok);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
    .dash-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:1.2rem;}
    @media(max-width:880px){.dash-cols{grid-template-columns:1fr;}}
    .leader-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
    .leader-row:last-child{border:none;}
    .leader-rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-weight:800;font-family:'Outfit';font-size:.85rem;background:var(--surface-3);}
    .leader-rank.r1{background:var(--gold);color:#1a1300;} .leader-rank.r2{background:var(--silver);color:#10151f;}
    .leader-rank.r3{background:#C77B3B;color:#1a0f02;}
    .leader-info{flex:1;}.leader-info b{font-weight:700;}.leader-info span{font-size:.78rem;color:var(--muted);display:block;}
    .mini-list li{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:.9rem;}
    .mini-list li:last-child{border:none;}

    /* ===== CHARTS ===== */
    .chart-box{width:100%;}
    .chart-box svg{width:100%;height:auto;display:block;}
    .chart-grid line{stroke:var(--line-soft);stroke-width:1;}
    .chart-axis{fill:var(--muted-2);font-size:10px;font-family:'Urbanist';}
    .spark-area{fill:url(#sparkfill);}
    .spark-line{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
    .spark-dot{fill:var(--ink);stroke:var(--brand);stroke-width:2.5;}
    .empty-chart{padding:2rem;text-align:center;color:var(--muted-2);font-style:italic;font-size:.88rem;}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
    .stat-cell{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:.9rem;}
    .stat-cell .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
    .stat-cell .v{font-size:1.5rem;font-weight:800;font-family:'Outfit';margin-top:3px;}
    .stat-cell .v small{font-size:.8rem;color:var(--muted);}

    /* ===== SCOUT ===== */
    .scout-table input{width:54px;background:var(--surface-2);border:1px solid var(--line);color:#fff;
        text-align:center;padding:7px 4px;border-radius:8px;font-weight:700;font-family:'Outfit';font-size:.9rem;}
    .scout-table input:focus{outline:none;border-color:var(--brand);}
    .scout-table th[colspan]{color:var(--brand);}
    .legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:1.2rem;}
    .legend-item{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:.8rem;font-size:.78rem;color:var(--muted);line-height:1.6;}
    .legend-item strong{display:block;color:var(--brand);margin-bottom:4px;letter-spacing:.5px;}
    .result-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .set-score{display:flex;align-items:center;gap:8px;}
    .set-score input{width:48px;text-align:center;background:var(--surface-2);border:1px solid var(--line);color:#fff;padding:9px;border-radius:9px;font-family:'Outfit';font-weight:800;font-size:1.1rem;}

    /* ===== ROTATION ===== */
    .rot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    @media(max-width:720px){.rot-grid{grid-template-columns:repeat(2,1fr);}}
    .rot-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:1rem;text-align:center;}
    .rot-cell h4{font-family:'Outfit';font-size:.95rem;color:var(--brand);margin-bottom:2px;}
    .rot-cell .pos{font-size:.66rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
    .rot-counters{display:flex;justify-content:center;gap:14px;}
    .rot-c{display:flex;flex-direction:column;align-items:center;gap:5px;}
    .rot-c .n{font-size:1.5rem;font-weight:800;font-family:'Outfit';}
    .rot-c .n.fatti{color:var(--ok);}.rot-c .n.subiti{color:var(--bad);}
    .rot-c .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
    .rot-c .stepper{display:flex;gap:5px;}
    .rot-c .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-3);
        color:#fff;font-weight:800;cursor:pointer;font-size:1rem;line-height:1;}
    .rot-c .stepper button:hover{border-color:var(--brand);}
    .rot-diff{margin-top:10px;font-weight:800;font-family:'Outfit';font-size:1.05rem;}

    /* ===== ATTENDANCE ===== */
    .att-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
    .att-row:last-child{border:none;}
    .att-name{flex:1;font-weight:600;}
    .att-toggle{display:flex;gap:6px;}
    .att-toggle button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
        color:var(--muted);font-weight:700;cursor:pointer;font-size:.8rem;font-family:'Urbanist';transition:.15s;}
    .att-toggle button.on.present{background:var(--ok);color:#04140A;border-color:var(--ok);}
    .att-toggle button.on.absent{background:var(--bad);color:#fff;border-color:var(--bad);}
    .att-toggle button.on.excused{background:var(--warn);color:#1a1300;border-color:var(--warn);}
    .bar-track{height:9px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-top:6px;}
    .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand-deep),var(--brand));transition:width .6s cubic-bezier(.2,.7,.2,1);}

    /* ===== TACTICAL ===== */
    .tactical-wrap{display:grid;grid-template-columns:1fr 260px;gap:1.2rem;}
    @media(max-width:880px){.tactical-wrap{grid-template-columns:1fr;}}
    #court-area{position:relative;width:100%;aspect-ratio:1/1;max-height:560px;background:#0a1322;border-radius:16px;
        border:1px solid var(--line);overflow:hidden;touch-action:none;}
    #courtCanvas{position:absolute;inset:0;width:100%;height:100%;}
    .token{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--brand);color:#04140A;
        display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Outfit';cursor:grab;
        box-shadow:0 6px 14px rgba(0,0,0,.5);user-select:none;touch-action:none;border:2px solid #fff;font-size:1rem;z-index:5;}
    .token.captain{background:var(--gold);border-color:#fff;}
    .token.vice{background:var(--silver);border-color:#fff;}
    .color-picker{display:flex;gap:8px;margin-top:6px;}
    .color-btn{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.15s;}
    .color-btn.active{border-color:#fff;transform:scale(1.1);}

    /* ===== MODAL ===== */
    .overlay{position:fixed;inset:0;background:rgba(4,8,18,.78);backdrop-filter:blur(4px);z-index:90;
        display:none;align-items:center;justify-content:center;padding:1rem;}
    .overlay.show{display:flex;animation:fade .2s ease;}
    @keyframes fade{from{opacity:0;}to{opacity:1;}}
    .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;
        max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.8,.2,1);}
    .modal.wide{max-width:720px;}
    @keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:none;}}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.3rem;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);z-index:2;}
    .modal-head h3{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:10px;}
    .modal-close{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1rem;transition:.15s;}
    .modal-close:hover{color:#fff;border-color:var(--flame);}
    .modal-body{padding:1.3rem;}
    .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:1.2rem;}
    .player-head{display:flex;align-items:center;gap:16px;margin-bottom:1.2rem;}
    .player-avatar{width:64px;height:64px;border-radius:16px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:800;font-size:1.6rem;}
    .player-head .meta h4{font-size:1.3rem;font-weight:800;}
    .player-head .meta p{color:var(--muted);font-size:.88rem;margin-top:2px;}

    /* ===== TOAST ===== */
    #toast-stack{position:fixed;top:calc(1rem + env(safe-area-inset-top));right:1rem;z-index:120;display:flex;flex-direction:column;gap:10px;max-width:90vw;}
    .toast{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
        border-left:3px solid var(--brand);padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);
        font-size:.88rem;font-weight:600;animation:slideIn .3s cubic-bezier(.2,.8,.2,1);min-width:240px;}
    .toast i{font-size:1.05rem;}
    .toast.success{border-left-color:var(--ok);} .toast.success i{color:var(--ok);}
    .toast.danger{border-left-color:var(--bad);} .toast.danger i{color:var(--bad);}
    .toast.warning{border-left-color:var(--warn);} .toast.warning i{color:var(--warn);}
    .toast.info{border-left-color:#5b9dff;} .toast.info i{color:#5b9dff;}
    @keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}
    @keyframes fadeOut{to{opacity:0;transform:translateX(30px);}}

    /* ===== MOBILE / TABLET ===== */
    #menu-toggle{display:none;position:fixed;top:calc(.9rem + env(safe-area-inset-top));left:.9rem;z-index:70;
        width:46px;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:#fff;font-size:1.1rem;cursor:pointer;box-shadow:var(--shadow);}
    #backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;}
    #backdrop.show{display:block;}
    #bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:65;gap:2px;
        background:linear-gradient(180deg,#0A1020,#070B16);border-top:1px solid var(--line-soft);
        padding:.45rem .35rem calc(.45rem + env(safe-area-inset-bottom));overflow-x:auto;
        box-shadow:0 -10px 24px -14px rgba(0,0,0,.6);}
    #bottom-nav button{flex:1 0 auto;min-width:48px;min-height:48px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);
        font-family:'Urbanist';font-weight:700;cursor:pointer;border-radius:11px;transition:.18s;padding:5px 4px;}
    #bottom-nav button i{font-size:1.05rem;}
    #bottom-nav button span{font-size:.6rem;letter-spacing:.2px;white-space:nowrap;}
    #bottom-nav button.active{color:var(--brand);background:rgba(34,197,94,.12);}
    #bottom-nav button:active{background:var(--surface-2);}
    @media(max-width:1180px){
        aside{transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);}
        aside.open{transform:none;}
        main{margin-left:0;padding:4.5rem 1.1rem 4rem;}
        #menu-toggle{display:flex;align-items:center;justify-content:center;}
        .page-head h2{font-size:1.5rem;}
        .hero h2{font-size:1.4rem;}
    }
    @media(min-width:600px) and (max-width:1180px){
        #bottom-nav{display:flex;}
        main{padding-bottom:5.8rem;}
    }
    .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted);}
    .empty-state i{font-size:2.4rem;color:var(--surface-3);margin-bottom:.8rem;display:block;}
    .empty-state b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px;}
    .row-actions{display:flex;gap:6px;justify-content:center;}

    /* INTRO — animazione di apertura sport-aware (Modulo M), identica al Player.
       Il campo si disegna da solo, zoom verso il centro, alone che pulsa, esplosione, logo.
       ~1.5-1.8s totali, saltabile con un tap. Contenuto sport-aware iniettato da app.js
       (piIntroRun()) appena curSport() è disponibile; il contenitore appare subito via CSS.
       Nota accessibilità: la scomparsa usa una transition (classe .pi-hide), non una
       @keyframes ...forwards — la regola reduced-motion qui sopra forza animation:none!important,
       che lascerebbe l'overlay bloccato per sempre se la scomparsa dipendesse da un'animazione. */
    #pl-intro{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;overflow:hidden;
        background:radial-gradient(1100px 700px at 80% -10%,rgba(34,197,94,.18),transparent 60%),radial-gradient(900px 600px at 0% 110%,rgba(91,155,255,.12),transparent 55%),linear-gradient(170deg,#0C1526,#060A18 60%);
        cursor:pointer;opacity:1;transition:opacity .32s ease;}
    #pl-intro.pi-hide{opacity:0;pointer-events:none;}
    #pl-intro-stage{position:relative;width:min(74vw,320px);aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;
        transition:transform .22s cubic-bezier(.3,.7,.2,1);}
    #pl-intro-stage.pi-zoom{transform:scale(1.6);}
    .pi-court{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
    .pi-court>*{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .46s cubic-bezier(.25,.65,.3,1);}
    #pl-intro-stage.pi-draw .pi-court>*{stroke-dashoffset:0;}
    .pi-halo{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;
        background:radial-gradient(circle,rgba(34,197,94,.55),rgba(34,197,94,0) 70%);pointer-events:none;}
    #pl-intro-stage.pi-pulse .pi-halo{animation:pi-halo-pulse .4s cubic-bezier(.3,.6,.3,1) both;}
    @keyframes pi-halo-pulse{
        0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
        18%{transform:translate(-50%,-50%) scale(2.1);opacity:.55;}
        34%{transform:translate(-50%,-50%) scale(1.15);opacity:.15;}
        55%{transform:translate(-50%,-50%) scale(3.3);opacity:.65;}
        72%{transform:translate(-50%,-50%) scale(1.5);opacity:.15;}
        90%{transform:translate(-50%,-50%) scale(4.4);opacity:.7;}
        100%{transform:translate(-50%,-50%) scale(1);opacity:0;}
    }
    .pi-burst{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;
        background:radial-gradient(circle,#fff,var(--brand) 40%,rgba(34,197,94,0) 72%);pointer-events:none;}
    #pl-intro-stage.pi-explode .pi-burst{animation:pi-burst .48s cubic-bezier(.15,.8,.25,1) both;}
    @keyframes pi-burst{0%{transform:translate(-50%,-50%) scale(0);opacity:1;}55%{transform:translate(-50%,-50%) scale(9);opacity:.8;}100%{transform:translate(-50%,-50%) scale(15);opacity:0;}}
    .pi-logo{position:relative;z-index:2;width:72px;height:72px;border-radius:18px;opacity:0;transform:scale(.7);
        box-shadow:0 16px 40px -12px rgba(0,0,0,.7);transition:opacity .36s ease,transform .36s cubic-bezier(.2,.8,.2,1);}
    #pl-intro-stage.pi-logo-in .pi-logo{opacity:1;transform:scale(1);}
    </style>
</head>
<body>
